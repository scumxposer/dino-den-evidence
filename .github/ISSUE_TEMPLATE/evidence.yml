name: Submit evidence
description: Share evidence that supports, disproves or adds to something in this repository.
title: "[Evidence] "
labels: ["evidence"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Evidence is added only if someone else can check it, and it is labelled by how well it is supported.
        This covers the Patreon and casino evidence, and evidence of how the owners or staff have treated players (bans, mutes or wipes without reason, retaliation, harassment, misuse of admin powers). For staff conduct, show the whole exchange and include any ban notice or ticket transcript.
        **Please do not include** real names, addresses, Steam profiles, alleged alt accounts, or private messages between other people. Messages from public Dino Den Discord channels, and messages staff sent to you while acting as staff, are fine. Include the channel and date; all usernames and avatars will be hidden before anything is published.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Patreon, currencies or casino games
        - Owner or staff conduct
        - Player counts
        - Correction or counter-evidence
        - Something else
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: What does this show?
      description: One or two sentences. Which finding or claim does it relate to?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: The evidence
      description: Links, original uncropped screenshots showing the date and time, or video clips with timestamps. Drag images in here.
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When was this captured or posted?
      placeholder: e.g. 27 Oct 2026, 14:05 UTC
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did it come from?
      options:
        - I captured it myself
        - Public post or page (linked above)
        - Someone else captured it
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: This contains no personal information (real names, addresses, profiles, or private messages between other people).
          required: true
        - label: This is shared to document facts, not to target or harass anyone.
          required: true
